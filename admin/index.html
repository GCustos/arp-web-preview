<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<script>
  window.SITE_PREFIX = location.hostname.endsWith('github.io') ? '/arp-web-preview' : '';
  document.write('<link rel="stylesheet" href="' + SITE_PREFIX + '/css/tokens.css">');
  document.write('<link rel="stylesheet" href="' + SITE_PREFIX + '/css/base.css">');
  document.write('<link rel="icon" type="image/svg+xml" href="' + SITE_PREFIX + '/favicon.svg">');
  document.write('<link rel="shortcut icon" href="' + SITE_PREFIX + '/favicon.ico">');
  document.write('<link rel="apple-touch-icon" href="' + SITE_PREFIX + '/apple-touch-icon.png">');
</script>
<title>Admin blog — ARP Prevención</title>
<style>
  body{background:var(--paper,#faf7f0)}
  .admin-wrap{max-width:720px;margin:0 auto;padding:40px 20px 80px}
  .screen{display:none}
  .screen.vis{display:block}
  .login-box{max-width:320px;margin:80px auto;display:flex;flex-direction:column;gap:12px}
  .login-box input{padding:12px 14px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px}
  .login-box button{padding:12px;border:none;border-radius:8px;background:var(--gold-deep,#b8862f);color:#fff;font-weight:600;cursor:pointer}
  .login-hint{font-size:13px;color:#b23}
  .admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
  .admin-header h1{font-size:22px}
  .admin-header .who{font-size:12px;color:var(--muted)}
  .admin-header .who a{color:var(--muted);margin-left:10px}
  .btn{padding:10px 16px;border-radius:8px;border:1px solid var(--border);background:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .btn-primary{background:var(--gold-deep,#b8862f);color:#fff;border:none}
  .btn-danger{color:#b23;border-color:#e9b7b7}
  .post-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;background:#fff}
  .post-row .t{font-weight:600;font-size:14px}
  .post-row .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
  .badge-pub{background:#e6f4ea;color:#1e7d3a}
  .badge-draft{background:#f0eee8;color:#7a7568}
  .row-actions{display:flex;gap:8px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .field input[type=text],.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px}
  .field textarea{resize:vertical}
  .field .hint{font-size:11px;color:var(--muted);margin-top:4px}
  .editor-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .editor-toolbar button{padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;font-family:inherit;font-size:12px;cursor:pointer}
  .editor-toolbar button:hover{background:#f5f3ee}
  #form-content{min-height:220px;font-family:inherit;font-size:14px;line-height:1.6;border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:#fff}
  #form-content:focus{outline:2px solid var(--gold-deep,#b8862f);outline-offset:-1px}
  #form-content h2{font-size:20px;margin:14px 0 6px}
  #form-content h3{font-size:16px;margin:12px 0 6px}
  #form-content p{margin:0 0 10px}
  #form-content ul,#form-content ol{margin:0 0 10px 20px}
  #form-preview{max-width:260px;border-radius:8px;margin-top:8px;display:none}
  .form-actions{display:flex;gap:10px;margin-top:24px}
  .publish-result{margin-top:16px;padding:12px 14px;border-radius:8px;font-size:13px}
  .publish-result.ok{background:#e6f4ea;color:#1e7d3a}
  .publish-result.err{background:#fbeaea;color:#a33}
  .publish-result ul{margin:6px 0 0 18px}
</style>
</head>
<body>

<div class="admin-wrap">

  <div class="screen vis" id="screen-login">
    <div class="login-box">
      <h1 style="text-align:center;font-size:18px">Admin blog ARP</h1>
      <input type="email" id="login-email" placeholder="correo@ejemplo.com" autocomplete="email">
      <input type="password" id="login-pass" placeholder="Contraseña" autocomplete="current-password">
      <button class="btn-primary" onclick="doLogin()">Entrar</button>
      <div class="login-hint" id="login-hint" style="display:none"></div>
    </div>
  </div>

  <div class="screen" id="screen-list">
    <div class="admin-header">
      <h1>Casos / blog</h1>
      <div class="who"><span id="who-email"></span><a href="#" onclick="doLogout();return false">Cerrar sesión</a></div>
    </div>
    <button class="btn btn-primary" style="margin-bottom:20px" onclick="openForm(null)">+ Nuevo caso</button>
    <div id="post-list"></div>
  </div>

  <div class="screen" id="screen-form">
    <div class="admin-header">
      <h1 id="form-title-h1">Nuevo caso</h1>
      <button class="btn" onclick="closeForm()">← Volver</button>
    </div>

    <div class="field">
      <label>Título</label>
      <input type="text" id="form-titulo">
    </div>
    <div class="field">
      <label>Resumen (aparece en la lista y en redes sociales)</label>
      <textarea id="form-resumen" rows="2"></textarea>
    </div>
    <div class="field">
      <label>Tag</label>
      <input type="text" id="form-tag" placeholder="Ej: Parques de aventura">
    </div>
    <div class="field">
      <label>Foto</label>
      <input type="file" id="form-imagen-file" accept="image/*">
      <img id="form-preview">
    </div>
    <div class="field">
      <label>Contenido</label>
      <div class="editor-toolbar">
        <button type="button" onmousedown="event.preventDefault()" onclick="document.execCommand('bold')"><strong>N</strong></button>
        <button type="button" onmousedown="event.preventDefault()" onclick="document.execCommand('italic')"><em>C</em></button>
        <button type="button" onmousedown="event.preventDefault()" onclick="document.execCommand('formatBlock', false, '&lt;h2&gt;')">Título grande</button>
        <button type="button" onmousedown="event.preventDefault()" onclick="document.execCommand('formatBlock', false, '&lt;h3&gt;')">Título pequeño</button>
        <button type="button" onmousedown="event.preventDefault()" onclick="document.execCommand('formatBlock', false, '&lt;p&gt;')">Párrafo</button>
        <button type="button" onmousedown="event.preventDefault()" onclick="document.execCommand('insertUnorderedList')">Lista</button>
        <button type="button" onmousedown="event.preventDefault()" onclick="insertarEnlace()">Enlace</button>
        <button type="button" onmousedown="event.preventDefault()" onclick="document.execCommand('removeFormat')">Quitar formato</button>
      </div>
      <div id="form-content" contenteditable="true"></div>
      <div class="hint">Escribe aquí o pega directamente desde Google Docs — la negrita, los títulos y las listas se adaptan solos al estilo del sitio (colores y fuentes de Google se descartan).</div>
    </div>

    <div class="form-actions">
      <button class="btn" onclick="previewPost()">Vista previa</button>
      <button class="btn" onclick="savePost(false)">Guardar borrador</button>
      <button class="btn btn-primary" id="btn-publicar" onclick="savePost(true)">Publicar (web + redes)</button>
      <button class="btn btn-danger" id="btn-delete" style="display:none" onclick="deletePost()">Eliminar</button>
    </div>
    <div id="publish-result"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>
<script>
  document.write('<script src="' + SITE_PREFIX + '/js/firebase-init.js"><\/script>');
</script>
<script>
  var ALLOWED_EDITORS = [
    'guimarcon.arp@gmail.com',
    'josmorvel.arp@gmail.com',
    'natcrualb.arp@gmail.com'
  ];

  // Dominio real fijo: el enlace publicado en redes y los assets de la vista
  // previa deben apuntar siempre a la web pública, aunque el admin se abra
  // en local o en la demo de GitHub Pages para probar.
  var SITE_URL = 'https://www.arpprevencion.com';

  var auth, storage, functions;
  var currentPostId = null;
  var currentImagenUrl = null;
  var postYaPublicado = false;

  // Limpieza del HTML pegado desde Google Docs / Word: esos editores no usan
  // <strong>/<h2> reales, marcan negrita y tamaño de título con CSS en línea
  // sobre <span>/<p> (y en Google Docs concretamente todo el documento viene
  // envuelto en un <b style="font-weight:normal" id="docs-internal-guid-...">
  // que hay que respetar como "no negrita" pese a ser un <b>). Esta función
  // convierte esas pistas de estilo a las etiquetas limpias que usa el sitio
  // y descarta el resto (fuentes, colores, tamaños de Google).
  function esNegritaEstilo(el) {
    var estilo = el.getAttribute('style') || '';
    var m = estilo.match(/font-weight:\s*([a-z0-9]+)/i);
    if (m) {
      // un font-weight explícito manda incluso sobre una etiqueta <b> —
      // así se respeta el <b style="font-weight:normal" id="docs-internal-guid-...">
      // con el que Google Docs envuelve todo el documento al copiar.
      var val = m[1].toLowerCase();
      return val === 'bold' || parseInt(val, 10) >= 600;
    }
    return el.tagName === 'B' || el.tagName === 'STRONG';
  }
  function esCursivaEstilo(el) {
    var estilo = el.getAttribute('style') || '';
    if (el.tagName === 'I' || el.tagName === 'EM') return true;
    return /font-style:\s*italic/i.test(estilo);
  }
  function tamanoPt(el) {
    var estilo = el.getAttribute('style') || '';
    var m = estilo.match(/font-size:\s*([\d.]+)pt/i);
    return m ? parseFloat(m[1]) : null;
  }

  function limpiarNodo(padre) {
    Array.prototype.slice.call(padre.childNodes).forEach(function(hijo) {
      if (hijo.nodeType === 3) return; // texto: se queda tal cual
      if (hijo.nodeType !== 1) { padre.removeChild(hijo); return; }

      limpiarNodo(hijo); // primero los hijos (de dentro hacia fuera)

      var negrita = esNegritaEstilo(hijo);
      var cursiva = esCursivaEstilo(hijo);
      var pt = tamanoPt(hijo);
      var tag = hijo.tagName;

      var final = null;
      if (tag === 'A') final = 'A';
      else if (tag === 'IMG') final = 'IMG';
      else if (tag === 'LI') final = 'LI';
      else if (tag === 'UL') final = 'UL';
      else if (tag === 'OL') final = 'OL';
      else if (tag === 'BR') final = 'BR';
      else if (pt !== null && pt >= 18) final = 'H2';
      else if (pt !== null && pt >= 14) final = 'H3';
      else if (tag === 'P' || tag === 'DIV') final = 'P';

      if (!final) {
        // span, font, b/i sueltos, etc: se desenvuelve conservando negrita/cursiva
        var interior = hijo.innerHTML;
        if (negrita) interior = '<strong>' + interior + '</strong>';
        if (cursiva) interior = '<em>' + interior + '</em>';
        var tmp = document.createElement('div');
        tmp.innerHTML = interior;
        while (tmp.firstChild) padre.insertBefore(tmp.firstChild, hijo);
        padre.removeChild(hijo);
        return;
      }

      var limpio = document.createElement(final);
      if (final === 'A') {
        limpio.setAttribute('href', hijo.getAttribute('href') || '#');
        limpio.setAttribute('target', '_blank');
        limpio.setAttribute('rel', 'noopener');
        limpio.innerHTML = hijo.innerHTML;
      } else if (final === 'IMG') {
        limpio.setAttribute('src', hijo.getAttribute('src') || '');
        limpio.setAttribute('alt', hijo.getAttribute('alt') || '');
      } else if (final !== 'BR') {
        var interiorB = hijo.innerHTML;
        if (negrita && final !== 'H2' && final !== 'H3') interiorB = '<strong>' + interiorB + '</strong>';
        if (cursiva) interiorB = '<em>' + interiorB + '</em>';
        limpio.innerHTML = interiorB;
      }
      padre.replaceChild(limpio, hijo);
    });
  }

  function limpiarHtmlPegado(sucio) {
    var contenedor = document.createElement('div');
    contenedor.innerHTML = sucio;
    limpiarNodo(contenedor);
    return contenedor.innerHTML;
  }

  window.insertarEnlace = function() {
    var url = prompt('URL del enlace:');
    if (!url) return;
    document.execCommand('createLink', false, url);
  };

  function show(id) {
    document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('vis'); });
    document.getElementById(id).classList.add('vis');
  }

  window.doLogin = function() {
    var email = document.getElementById('login-email').value.trim();
    var pass = document.getElementById('login-pass').value;
    var hint = document.getElementById('login-hint');
    hint.style.display = 'none';
    if (!email || !pass) return;
    auth.signInWithEmailAndPassword(email, pass).catch(function(e) {
      hint.textContent = 'Email o contraseña incorrectos.';
      hint.style.display = 'block';
    });
  };

  window.doLogout = function() {
    auth.signOut();
  };

  function initAdmin() {
    auth = firebase.auth();
    storage = firebase.storage();
    functions = firebase.functions();

    auth.onAuthStateChanged(function(user) {
      if (!user || ALLOWED_EDITORS.indexOf(user.email) === -1) {
        if (user) auth.signOut();
        show('screen-login');
        return;
      }
      document.getElementById('who-email').textContent = user.email;
      show('screen-list');
      loadPosts();
    });
  }

  var _initInterval = setInterval(function() {
    if (typeof db !== 'undefined') {
      clearInterval(_initInterval);
      initAdmin();
    }
  }, 50);

  function formatFecha(ts) {
    if (!ts) return 'sin fecha';
    var d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function loadPosts() {
    db.collection('posts').orderBy('fecha', 'desc').limit(50).get().then(function(snap) {
      var list = document.getElementById('post-list');
      if (snap.empty) {
        list.innerHTML = '<p style="color:var(--muted);font-size:14px">Todavía no hay casos.</p>';
        return;
      }
      list.innerHTML = snap.docs.map(function(doc) {
        var p = doc.data();
        var badge = p.publicado
          ? '<span class="badge badge-pub">Publicado</span>'
          : '<span class="badge badge-draft">Borrador</span>';
        return [
          '<div class="post-row">',
            '<div>',
              '<div class="t">' + (p.titulo || '(sin título)') + '</div>',
              '<div class="meta">' + formatFecha(p.fecha) + ' &middot; ' + badge + '</div>',
            '</div>',
            '<div class="row-actions">',
              '<button class="btn" onclick="openForm(\'' + doc.id + '\')">Editar</button>',
            '</div>',
          '</div>'
        ].join('');
      }).join('');
    });
  }

  window.openForm = function(postId) {
    currentPostId = postId;
    currentImagenUrl = null;
    postYaPublicado = false;
    document.getElementById('form-titulo').value = '';
    document.getElementById('form-resumen').value = '';
    document.getElementById('form-tag').value = '';
    document.getElementById('form-content').innerHTML = '';
    document.getElementById('form-imagen-file').value = '';
    document.getElementById('form-preview').style.display = 'none';
    document.getElementById('publish-result').innerHTML = '';
    document.getElementById('btn-delete').style.display = postId ? 'inline-block' : 'none';
    document.getElementById('btn-publicar').textContent = 'Publicar (web + redes)';

    if (!postId) {
      document.getElementById('form-title-h1').textContent = 'Nuevo caso';
      show('screen-form');
      return;
    }

    document.getElementById('form-title-h1').textContent = 'Editar caso';
    db.collection('posts').doc(postId).get().then(function(doc) {
      var p = doc.data();
      document.getElementById('form-titulo').value = p.titulo || '';
      document.getElementById('form-resumen').value = p.resumen || '';
      document.getElementById('form-tag').value = p.tag || '';
      document.getElementById('form-content').innerHTML = p.contenido || '';
      if (p.imagen) {
        currentImagenUrl = p.imagen;
        var img = document.getElementById('form-preview');
        img.src = p.imagen;
        img.style.display = 'block';
      }
      postYaPublicado = !!p.publicado;
      if (postYaPublicado) document.getElementById('btn-publicar').textContent = 'Guardar cambios';
      show('screen-form');
    });
  };

  window.closeForm = function() {
    show('screen-list');
    loadPosts();
  };

  function subirImagenSiHace(postId) {
    var file = document.getElementById('form-imagen-file').files[0];
    if (!file) return Promise.resolve(currentImagenUrl);
    var ref = storage.ref('posts/' + postId + '/imagen_' + Date.now());
    return ref.put(file).then(function() { return ref.getDownloadURL(); });
  }

  window.savePost = function(publicar) {
    var docRef = currentPostId ? db.collection('posts').doc(currentPostId) : db.collection('posts').doc();
    var postId = docRef.id;
    var esNuevo = !currentPostId;

    var data = {
      titulo: document.getElementById('form-titulo').value.trim(),
      resumen: document.getElementById('form-resumen').value.trim(),
      tag: document.getElementById('form-tag').value.trim(),
      contenido: limpiarHtmlPegado(document.getElementById('form-content').innerHTML),
      publicado: publicar
    };

    if (!data.titulo) { alert('Falta el título.'); return; }

    subirImagenSiHace(postId).then(function(imagenUrl) {
      if (imagenUrl) data.imagen = imagenUrl;
      if (esNuevo) data.fecha = firebase.firestore.FieldValue.serverTimestamp();

      return docRef.set(data, { merge: true }).then(function() {
        currentPostId = postId;
        var esPrimeraPublicacion = publicar && !postYaPublicado;
        postYaPublicado = data.publicado;
        document.getElementById('btn-publicar').textContent = postYaPublicado ? 'Guardar cambios' : 'Publicar (web + redes)';
        if (!esPrimeraPublicacion) { closeForm(); return; }
        return publicarEnRedes(data.titulo, data.resumen, imagenUrl, postId);
      });
    }).catch(function(e) {
      alert('Error guardando: ' + e.message);
    });
  };

  function publicarEnRedes(titulo, resumen, imagenUrl, postId) {
    var url = SITE_URL + '/blog/post/?id=' + postId;
    var texto = titulo + (resumen ? '\n\n' + resumen : '') + '\n\n' + url;
    var call = functions.httpsCallable('publishToSocial');
    var box = document.getElementById('publish-result');
    box.className = 'publish-result';
    box.textContent = 'Publicando en LinkedIn y Facebook…';

    return call({ text: texto, imageUrl: imagenUrl || null }).then(function(res) {
      var lines = Object.keys(res.data).map(function(net) {
        var r = res.data[net];
        return '<li>' + net + ': ' + (r.ok ? 'OK' : 'Error — ' + r.error) + '</li>';
      });
      var allOk = Object.keys(res.data).every(function(net) { return res.data[net].ok; });
      box.className = 'publish-result ' + (allOk ? 'ok' : 'err');
      box.innerHTML = 'Post guardado en la web. Redes sociales:<ul>' + lines.join('') + '</ul>';
    }).catch(function(e) {
      box.className = 'publish-result err';
      box.textContent = 'El post se guardó en la web, pero falló la publicación en redes: ' + e.message;
    });
  }

  function escPreview(s) {
    return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  window.previewPost = function() {
    var win = window.open('', '_blank');
    if (!win) { alert('El navegador ha bloqueado la vista previa. Permite las ventanas emergentes para este sitio.'); return; }

    var titulo = document.getElementById('form-titulo').value.trim() || '(sin título)';
    var resumen = document.getElementById('form-resumen').value.trim();
    var tag = document.getElementById('form-tag').value.trim();
    var contenido = limpiarHtmlPegado(document.getElementById('form-content').innerHTML);
    var file = document.getElementById('form-imagen-file').files[0];
    var imagenSrc = file ? URL.createObjectURL(file) : (currentImagenUrl || '');
    var fechaTexto = new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
    var origin = SITE_URL;

    var html = [
      '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1.0">',
      '<link rel="stylesheet" href="' + origin + '/css/tokens.css">',
      '<link rel="stylesheet" href="' + origin + '/css/base.css">',
      '<title>Vista previa — ' + escPreview(titulo) + '</title>',
      '<link rel="preconnect" href="https://fonts.googleapis.com">',
      '<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">',
      '<style>',
      '.preview-banner{position:sticky;top:0;z-index:10;background:#1a1a1a;color:#fff;text-align:center;font-family:monospace;font-size:12px;letter-spacing:.06em;padding:8px;text-transform:uppercase}',
      '.post-hero{padding:0;border-bottom:1px solid var(--border)}',
      '.post-hero-img{width:100%;max-height:420px;object-fit:cover;display:block}',
      '.post-hero-content{padding:36px 0 32px}',
      '.post-breadcrumb{font-family:var(--font-mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:20px}',
      '.post-meta{display:flex;align-items:center;gap:14px;margin-bottom:16px}',
      '.post-date{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}',
      '.post-tag{font-family:var(--font-mono);font-size:10.5px;color:var(--rope);background:#f5ede0;border-radius:20px;padding:2px 10px;letter-spacing:.04em}',
      '.post-title{font-size:42px;line-height:1.1;max-width:760px;margin-bottom:14px}',
      '.post-resumen{font-size:18px;color:#4a463f;max-width:680px;line-height:1.6}',
      '.post-body{padding:52px 0 88px}',
      '.post-layout{display:grid;grid-template-columns:1fr 280px;gap:64px;align-items:start}',
      '.post-content{font-size:16px;line-height:1.8;color:#2a2820;max-width:680px}',
      '.post-content h2{font-size:24px;margin:36px 0 14px}',
      '.post-content h3{font-size:20px;margin:28px 0 10px}',
      '.post-content p{margin-bottom:18px}',
      '.post-content ul,.post-content ol{margin:0 0 18px 22px}',
      '.post-content li{margin-bottom:6px}',
      '.post-content strong{color:var(--ink)}',
      '.post-content img{border-radius:8px;margin:24px 0;max-width:100%}',
      '.post-sidebar{position:sticky;top:32px;display:flex;flex-direction:column;gap:16px}',
      '.post-sidebar-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px 22px}',
      '.post-sidebar-card h4{font-size:13px;font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em;font-family:var(--font-mono);color:var(--muted)}',
      '.post-sidebar-card p{font-size:13.5px;color:var(--muted);line-height:1.6}',
      '.post-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-family:var(--font-mono);text-decoration:none;margin-bottom:8px}',
      '@media(max-width:900px){.post-layout{grid-template-columns:1fr}.post-sidebar{position:static}.post-title{font-size:30px}}',
      '</style></head><body>',
      '<div class="preview-banner">Vista previa — todavía no publicado</div>',
      '<div id="site-header" data-active="blog"></div>',
      '<div class="post-hero">',
      (imagenSrc ? '<img class="post-hero-img" src="' + imagenSrc + '" alt="">' : ''),
      '<div class="wrap post-hero-content">',
      '<nav class="post-breadcrumb"><a href="' + origin + '/blog/">Casos</a><span>&rsaquo;</span><span>' + escPreview(titulo) + '</span></nav>',
      '<div class="post-meta"><span class="post-date">' + fechaTexto + '</span>',
      (tag ? '<span class="post-tag">' + escPreview(tag) + '</span>' : ''),
      '</div>',
      '<h1 class="post-title">' + escPreview(titulo) + '</h1>',
      '<p class="post-resumen">' + escPreview(resumen) + '</p>',
      '</div></div>',
      '<div class="post-body"><div class="wrap"><div class="post-layout">',
      '<div class="post-content">' + contenido + '</div>',
      '<aside class="post-sidebar">',
      '<a href="' + origin + '/blog/" class="post-back">← Todos los casos</a>',
      '<div class="post-sidebar-card"><h4>Publicado por</h4><p>ARP Prevención — Entidad de Inspección · ISO 17020</p></div>',
      '<div class="post-sidebar-card"><h4>¿Tienes una instalación similar?</h4><p>Cuéntanos el tipo de instalación y te enviamos presupuesto sin compromiso.</p></div>',
      '<a href="' + origin + '/contacto/" class="btn-primary" style="text-align:center">Solicitar inspección →</a>',
      '</aside></div></div></div>',
      '<div id="site-footer"></div>',
      '<script src="' + origin + '/js/site-config.js"><\/script>',
      '<script src="' + origin + '/js/site-header.js"><\/script>',
      '<script src="' + origin + '/js/site-footer.js"><\/script>',
      '</body></html>'
    ].join('');

    win.document.open();
    win.document.write(html);
    win.document.close();
  };

  window.deletePost = function() {
    if (!currentPostId) return;
    if (!confirm('¿Eliminar este caso definitivamente?')) return;
    db.collection('posts').doc(currentPostId).delete().then(closeForm);
  };

  document.getElementById('form-imagen-file').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var img = document.getElementById('form-preview');
    img.src = URL.createObjectURL(file);
    img.style.display = 'block';
  });

  document.getElementById('form-content').addEventListener('paste', function(e) {
    e.preventDefault();
    var html = e.clipboardData && e.clipboardData.getData('text/html');
    if (html) {
      document.execCommand('insertHTML', false, limpiarHtmlPegado(html));
    } else {
      var texto = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
      document.execCommand('insertText', false, texto);
    }
  });
</script>
</body>
</html>
